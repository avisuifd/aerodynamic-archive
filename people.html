<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aerodynamic/Archive — People</title>
<style>
  :root{
    --bg:#050608;
    --line:rgba(255,255,255,0.06);
    --line-2:rgba(255,255,255,0.09);
    --text:#c4cdd4;
    --text-dim:rgba(196,205,212,0.5);
    --text-dimmer:rgba(196,205,212,0.35);
    --blue:#3b82f6;
    --blue-hover:#60a5fa;
    --amber:#fbbf24;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'Consolas', 'SFMono-Regular', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);}
  body{min-height:100vh;font-weight:300;}
  a{color:inherit;text-decoration:none;}
  button{font-family:var(--font);cursor:pointer;}
  .hidden{display:none !important;}

  header{position:sticky;top:0;z-index:50;background:rgba(5,6,8,0.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
  .header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 40px;}
  .brand{display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;}
  .brand svg{width:16px;height:16px;color:var(--blue);flex-shrink:0;}
  .brand-text{border:1px solid var(--line-2);padding:5px 10px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.2em;color:var(--text);}
  .brand-text .slash{color:var(--blue);}
  .back-link{display:flex;align-items:center;gap:8px;background:none;border:none;font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--text-dimmer);transition:color .15s;}
  .back-link:hover{color:var(--blue);}
  .back-link svg{width:13px;height:13px;}

  .wrap{max-width:1200px;margin:0 auto;padding:56px 40px 100px;}
  .eyebrow{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.4em;color:var(--blue);}
  h1{margin:20px 0 0;font-size:clamp(26px,4vw,40px);font-weight:300;color:var(--text);}
  .sub{margin:14px 0 0;max-width:560px;font-size:15px;line-height:1.6;color:var(--text-dim);}

  .search-row{margin-top:40px;position:relative;max-width:480px;}
  .search-icon{position:absolute;left:0;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-dimmer);}
  .search-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line-2);padding:10px 0 10px 26px;font-size:16px;color:var(--text);outline:none;transition:border-color .2s;}
  .search-input:focus{border-color:var(--blue);}
  .search-input::placeholder{color:rgba(196,205,212,0.3);}

  .people-list{margin-top:40px;border-top:1px solid var(--line);}
  .person-row{display:flex;align-items:center;gap:18px;padding:20px 0;border-bottom:1px solid var(--line);}
  .person-avatar{width:42px;height:42px;flex-shrink:0;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--blue);background:rgba(59,130,246,0.06);}
  .person-main{flex:1;min-width:0;}
  .person-name{font-size:15px;color:var(--text);display:flex;align-items:center;gap:10px;}
  .person-email{margin-top:3px;font-size:12px;color:var(--text-dimmer);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .role-badge{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;letter-spacing:.15em;padding:3px 8px;border:1px solid var(--line-2);color:var(--text-dimmer);}
  .role-badge.owner{color:var(--amber);border-color:rgba(251,191,36,.35);}
  .role-badge.screener{color:var(--blue);border-color:rgba(59,130,246,.4);}
  .role-actions{flex-shrink:0;}
  .role-btn{border:1px solid var(--line-2);background:transparent;color:var(--text-dim);padding:8px 16px;font-size:10px;text-transform:uppercase;letter-spacing:.18em;transition:border-color .15s,color .15s;}
  .role-btn:hover{border-color:rgba(59,130,246,.5);color:var(--blue);}
  .role-btn.revoke:hover{border-color:rgba(251,191,36,.5);color:var(--amber);}
  .role-btn:disabled{opacity:.4;cursor:not-allowed;}

  .empty-line{margin-top:30px;font-size:14px;color:var(--text-dim);}
  .loading-row{display:flex;align-items:center;gap:10px;color:var(--text-dim);font-size:13px;padding:30px 0;}
  .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,0.15);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .denied-card{max-width:440px;margin:80px auto;border:1px solid var(--line);padding:36px;text-align:center;}
  .denied-card p{font-size:14px;color:var(--text-dim);line-height:1.6;}

  @media (max-width:700px){
    .header-inner{padding:14px 20px;}
    .wrap{padding:40px 20px 80px;}
    .person-row{flex-wrap:wrap;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <button class="brand" onclick="location.href='index.html'">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 00-3 0V9l-8 5v2l8-2.5V19l-2.5 1.5V22l4-1 4 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
      <span class="brand-text">Aerodynamic<span class="slash">/</span>Archive</span>
    </button>
    <button class="back-link" onclick="location.href='index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      Back to Archive
    </button>
  </div>
</header>

<div class="wrap">
  <div id="loadingState" class="loading-row"><span class="spin"></span> Checking access…</div>

  <div id="deniedState" class="hidden">
    <div class="denied-card">
      <div class="eyebrow">Restricted</div>
      <h1 style="font-size:22px;">People</h1>
      <p>This page is limited to the archive owner and screeners.</p>
    </div>
  </div>

  <div id="peopleContent" class="hidden">
    <div class="eyebrow">People</div>
    <h1>Search the roster.</h1>
    <p class="sub" id="pageSub">Search by display name or email.</p>

    <div class="search-row">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search name or email…">
    </div>

    <div class="people-list" id="peopleList"></div>
    <p class="empty-line hidden" id="emptyState">No one matches that search.</p>
  </div>
</div>

<script type="module">
  import { auth } from './firebase-config.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
  import { ensureUserDoc, searchUsers, setUserRole } from './roles.js';

  let currentUser = null;
  let viewerRole = 'user';
  let people = [];

  function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

  function renderPeople(list){
    const wrap = document.getElementById('peopleList');
    wrap.innerHTML = '';
    document.getElementById('emptyState').classList.toggle('hidden', list.length>0);
    list.forEach(u=>{
      const name = u.displayName || (u.email ? u.email.split('@')[0] : 'Unnamed');
      const isOwner = u.role === 'owner';
      const isScreener = u.role === 'screener';
      const row = document.createElement('div');
      row.className = 'person-row';

      const canManage = viewerRole === 'owner' && u.uid !== currentUser.uid && !isOwner;
      const actionHTML = canManage
        ? (isScreener
            ? `<button class="role-btn revoke" data-uid="${esc(u.uid)}" data-action="revoke">Revoke Screener</button>`
            : `<button class="role-btn" data-uid="${esc(u.uid)}" data-action="grant">Grant Screener</button>`)
        : '';

      row.innerHTML = `
        <div class="person-avatar">${esc(name.charAt(0).toUpperCase())}</div>
        <div class="person-main">
          <div class="person-name">
            ${esc(name)}
            ${isOwner ? '<span class="role-badge owner">Owner</span>' : ''}
            ${isScreener ? '<span class="role-badge screener">Screener</span>' : ''}
          </div>
          <div class="person-email">${esc(u.email||'')}</div>
        </div>
        <div class="role-actions">${actionHTML}</div>
      `;
      wrap.appendChild(row);
    });

    wrap.querySelectorAll('[data-action]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const uid = btn.dataset.uid;
        const action = btn.dataset.action;
        btn.disabled = true;
        btn.textContent = action === 'grant' ? 'Granting…' : 'Revoking…';
        try{
          await setUserRole(uid, action === 'grant' ? 'screener' : 'user');
          people = await searchUsers(document.getElementById('searchInput').value);
          renderPeople(people);
        }catch(e){
          console.error(e);
          btn.disabled = false;
          btn.textContent = action === 'grant' ? 'Grant Screener' : 'Revoke Screener';
          alert('Could not update that role. Please try again.');
        }
      });
    });
  }

  document.getElementById('searchInput').addEventListener('input', async (e)=>{
    people = await searchUsers(e.target.value);
    renderPeople(people);
  });

  onAuthStateChanged(auth, async (user)=>{
    if(!user){
      location.href = 'auth.html?return=people';
      return;
    }
    currentUser = user;
    const userDoc = await ensureUserDoc(user);
    viewerRole = userDoc.role || 'user';

    document.getElementById('loadingState').classList.add('hidden');

    if(viewerRole !== 'owner' && viewerRole !== 'screener'){
      document.getElementById('deniedState').classList.remove('hidden');
      return;
    }

    document.getElementById('pageSub').textContent = viewerRole === 'owner'
      ? 'Search by display name or email. As the owner, you can grant or revoke screener access.'
      : 'Search by display name or email.';

    people = await searchUsers('');
    renderPeople(people);
    document.getElementById('peopleContent').classList.remove('hidden');
  });
</script>
</body>
</html>
